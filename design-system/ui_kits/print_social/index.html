<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--jho-newsprint);font-family:var(--jho-font-text);color:var(--jho-text)}button{font-family:inherit}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Poster.jsx?v=24"></script>
<script type="text/babel" src="Social.jsx?v=24"></script>
<script type="text/babel">
const { Headline, Eyebrow, MosaicRule } = window.JacksonHeightsOrchestraDesignSystem_6e3e82;
const TABS=[['A','Layout A · Big Type'],['B','Layout B · Color Block'],['C','Layout C · Editorial']];
const FINISHES=[['online','Online'],['print-color','Print · Color'],['print-bw','Print · B&W']];
function Kit(){
  const [layout,setLayout]=React.useState('A');
  const [finish,setFinish]=React.useState('online');
  const F=window.JHO_FINISH[finish];
  const Poster = {A:window.PosterA,B:window.PosterB,C:window.PosterC}[layout];
  return (
  <div style={{padding:'56px 60px',display:'flex',flexDirection:'column',gap:44}}>
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',
                   borderBottom:'1px solid var(--jho-ink)',paddingBottom:16,marginBottom:12}}>
        <Headline level="h1">Concert poster.</Headline>
        <div style={{display:'flex',gap:6}}>
          {TABS.map(([k,l])=>(
            <button key={k} onClick={()=>setLayout(k)}
              style={{padding:'8px 16px',fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.15em',
                      fontWeight:600,borderRadius:'var(--jho-radius-pill)',cursor:'pointer',
                      border:'1px solid var(--jho-ink)',
                      background:layout===k?'var(--jho-ink)':'transparent',
                      color:layout===k?'var(--jho-paper)':'var(--jho-ink)'}}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:24}}>
        <Eyebrow>8.5 × 11 · preview only at ≈60 dpi — export print files from templates/concert-poster*</Eyebrow>
      </div>
      {layout==='A' ? (
        <div style={{marginTop:22}}>
          <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',
                       paddingBottom:16,borderBottom:'1px solid rgba(20,26,42,0.15)'}}>
            <span style={{fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.2em',
                          color:'var(--jho-muted)',fontWeight:600}}>Finish</span>
            <div style={{display:'flex',gap:6}}>
              {FINISHES.map(([k,l])=>(
                <button key={k} onClick={()=>setFinish(k)}
                  style={{padding:'7px 15px',fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.14em',
                          fontWeight:600,borderRadius:'var(--jho-radius-pill)',cursor:'pointer',
                          border:'1px solid var(--jho-ink)',
                          background:finish===k?'var(--jho-ink)':'transparent',
                          color:finish===k?'var(--jho-paper)':'var(--jho-ink)'}}>{l}</button>
              ))}
            </div>
            <span style={{fontSize:'13px',color:'var(--jho-muted)'}}>{F.note}</span>
          </div>
          <div style={{marginTop:28,display:'flex',gap:36,alignItems:'flex-start',flexWrap:'wrap'}}>
          {[[window.PosterSolo,'Solo','Conductor only'],[window.PosterDuo,'Duo','+ one soloist'],[window.PosterTrio,'Trio','+ two soloists']].map(([P,t,l])=>(
            <div key={t}>
              <P finish={finish}/>
              <div style={{textAlign:'center',marginTop:14}}>
                <div style={{fontFamily:'var(--jho-font-display)',fontWeight:700,fontSize:'18px'}}>{t}</div>
                <div style={{fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.18em',
                             color:'var(--jho-muted)',fontWeight:600,marginTop:'3px'}}>{l}</div>
                <div style={{fontFamily:'var(--jho-font-mono)',fontSize:'10px',color:'var(--jho-muted)',
                             marginTop:'8px',wordBreak:'break-all',maxWidth:'260px',marginInline:'auto'}}>
                  {window.jhoPosterFileName(t,finish)}
                </div>
              </div>
            </div>
          ))}
          <div style={{maxWidth:'300px',display:'flex',flexDirection:'column',gap:22,paddingTop:8}}>
            {[['Format', finish==='online'
                 ? '8.5 × 11 in. Paper ground (#FAF6EE) — the online finish, for web, email and social.'
                 : finish==='print-color'
                 ? '8.5 × 11 in on uncoated stock. Plain white ground for a commercial printer — otherwise identical to Online.'
                 : '8.5 × 11 in for newspaper listings. White ground, every text token forced to pure black — no grey type anywhere — and photos plus the mosaic bar desaturated.'],
              ['Finish is a token override','All three finishes render the SAME markup; only the CSS custom properties on the sheet root change. There is no forked B&W artwork to keep in sync — edit the poster once and every finish follows.'],
              ['File naming','Rendered files carry their purpose: JHO_2026-05-20_Poster-Duo_Print-BW.png. Use window.jhoPosterFileName(variant, finish) so an online JPEG and a newsprint file are never confused in a shared folder.'],
              ['Hierarchy','Presenter line, wordmark, mosaic bar, WHEN/WHERE, programme, footer. Always that order.'],
              ['Solo · Duo · Trio','The conductor always sits at 162px beside the wordmark. Duo adds one soloist at 126px beside the programme; Trio adds two, stepped down to 84px so the sheet still fits. Soloist names sit to the right of the frame.'],
              ['Griffin','The heritage seal sits top-left in the header beside the presenter line — 40px here, 52px in the print templates. The footer centre belongs to the donate QR, which swaps to a pure-black code in the B&W finish.']].map(([h,p])=>(
              <div key={h}>
                <h4 style={{fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.2em',color:'var(--jho-muted)',
                            margin:'0 0 6px',fontWeight:600}}>{h}</h4>
                <p style={{margin:0,fontSize:'14px',lineHeight:1.5}}>{p}</p>
              </div>
            ))}
          </div>
          </div>
          <div style={{marginTop:44,paddingTop:24,borderTop:'1px solid var(--jho-ink)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24}}>
              <Headline level="h3">Print · color.</Headline>
              <Eyebrow>Same artwork · plain white ground</Eyebrow>
            </div>
            <div style={{display:'flex',gap:36,alignItems:'flex-start',flexWrap:'wrap'}}>
              {[[window.PosterSolo,'Solo','Conductor only'],[window.PosterDuo,'Duo','+ one soloist'],[window.PosterTrio,'Trio','+ two soloists']].map(([P,t,l])=>(
                <div key={t}>
                  <P finish="print-color"/>
                  <div style={{textAlign:'center',marginTop:14}}>
                    <div style={{fontFamily:'var(--jho-font-display)',fontWeight:700,fontSize:'18px'}}>{t} · Print</div>
                    <div style={{fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.18em',
                                 color:'var(--jho-muted)',fontWeight:600,marginTop:'3px'}}>{l}</div>
                    <div style={{fontFamily:'var(--jho-font-mono)',fontSize:'10px',color:'var(--jho-muted)',
                                 marginTop:'8px',wordBreak:'break-all',maxWidth:'260px',marginInline:'auto'}}>
                      {window.jhoPosterFileName(t,'print-color')}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div style={{marginTop:44,paddingTop:24,borderTop:'1px solid var(--jho-ink)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24}}>
              <Headline level="h3">Newspaper · black &amp; white.</Headline>
              <Eyebrow>Pure black type · desaturated photos · white ground</Eyebrow>
            </div>
            <div style={{display:'flex',gap:36,alignItems:'flex-start',flexWrap:'wrap'}}>
              {[[window.PosterSolo,'Solo','Conductor only'],[window.PosterDuo,'Duo','+ one soloist'],[window.PosterTrio,'Trio','+ two soloists']].map(([P,t,l])=>(
                <div key={t}>
                  <P finish="print-bw"/>
                  <div style={{textAlign:'center',marginTop:14}}>
                    <div style={{fontFamily:'var(--jho-font-display)',fontWeight:700,fontSize:'18px'}}>{t} · B&amp;W</div>
                    <div style={{fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.18em',
                                 color:'var(--jho-muted)',fontWeight:600,marginTop:'3px'}}>{l}</div>
                    <div style={{fontFamily:'var(--jho-font-mono)',fontSize:'10px',color:'var(--jho-muted)',
                                 marginTop:'8px',wordBreak:'break-all',maxWidth:'260px',marginInline:'auto'}}>
                      {window.jhoPosterFileName(t,'print-bw')}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      ) : (
      <div style={{marginTop:28,display:'flex',gap:44,alignItems:'flex-start'}}>
        <Poster />
        <div style={{maxWidth:'380px',display:'flex',flexDirection:'column',gap:22,paddingTop:8}}>
          {(layout==='B'
            ? [['Format','8.5 × 11 in, printed on uncoated stock. Color block masthead — the one layout that reverses the wordmark out of a solid ground.'],
               ['Hierarchy','Presenter line, wordmark, WHEN/TIME/WHERE inside the color block, then the numbered programme. No mosaic bar — the color block carries the palette instead.'],
               ['Wordmark','Paper on Subway. One color, as always.'],
               ['Griffin','The heritage seal sits in the footer at 56px, never in the masthead. B and C carry no donate QR — that is Layout A only.']]
            : [['Format','8.5 × 11 in, printed on uncoated stock. Centred editorial layout — the only place JHO sets type centred.'],
               ['Hierarchy','Presenter line and date, wordmark between two heavy rules, quoted title, then WHERE/WHEN and the centred programme. No mosaic bar.'],
               ['Wordmark','Tandoor on paper. One color, as always.'],
               ['Griffin','The heritage seal sits in the footer at 56px, never in the masthead. B and C carry no donate QR — that is Layout A only.']]
          ).map(([h,p])=>(
            <div key={h}>
              <h4 style={{fontSize:'11px',textTransform:'uppercase',letterSpacing:'0.2em',color:'var(--jho-muted)',
                          margin:'0 0 6px',fontWeight:600}}>{h}</h4>
              <p style={{margin:0,fontSize:'15px',lineHeight:1.5}}>{p}</p>
            </div>
          ))}
        </div>
      </div>
      )}
    </div>

    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',
                   borderBottom:'1px solid var(--jho-ink)',paddingBottom:16,marginBottom:28}}>
        <Headline level="h1">Instagram · 1:1.</Headline>
        <Eyebrow>Concert announcement + season card</Eyebrow>
      </div>
      <div style={{display:'flex',gap:40,flexWrap:'wrap'}}>
        <window.IGConcert /><window.IGBrand />
      </div>
    </div>

    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',
                   borderBottom:'1px solid var(--jho-ink)',paddingBottom:16,marginBottom:28}}>
        <Headline level="h1">Instagram stories · 9:16.</Headline>
        <Eyebrow>Three variants</Eyebrow>
      </div>
      <div style={{display:'flex',gap:24}}>
        {[[window.StoryConcert,'Concert · paper'],[window.StoryArtistSpotlight,'Artist spotlight · newsprint'],[window.StorySeason,'Season · ink']]
          .map(([S,l])=>(
          <div key={l}><S/>
            <div style={{textAlign:'center',marginTop:14,fontSize:'11px',textTransform:'uppercase',
                         letterSpacing:'0.18em',color:'var(--jho-muted)',fontWeight:600}}>{l}</div>
          </div>
        ))}
      </div>
    </div>
    <MosaicRule/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Kit/>);
</script></body></html>
